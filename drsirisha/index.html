<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#ffffff" />
<meta name="description" content="SLAM for drones in GPS-denied environments: open-source methods, live simulations, embedded benchmarks, best-fit selector and research roadmap. A field guide prepared for Sirisha." />
<title>SLAM for Drones · GPS-denied field guide</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d1d1f'/%3E%3Cpath d='M8 8l16 16M8 24L24 8' stroke='white' stroke-width='3'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" />
<style>
:root{
  --bg:#ffffff;--ink:#1d1d1f;--mute:#6e6e73;--mute-2:#8e8e93;--hair:#e3e3e8;--soft:#f5f5f7;--soft-2:#ececf0;--soft-3:#e4e4ea;
  --accent:#1a73e8;
  --vis:#1a73e8;--lid:#d93025;--fus:#188038;--spc:#9334e6;--lrn:#e37400;--swm:#00838f;--inf:#5f6368;
  --ok:#188038;--warn:#b06000;--bad:#d93025;
  --display:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-xl:28px;--r-lg:22px;--r-md:16px;--r-sm:10px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --gut:max(20px,env(safe-area-inset-left,0px));--gutr:max(20px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px;overflow-x:clip;color-scheme:light}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip}
body.lock{overflow:hidden}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.wrap{padding-left:var(--gut);padding-right:var(--gutr);max-width:1400px;margin:0 auto}
.mono{font-family:var(--mono);font-size:11.5px;letter-spacing:.01em}
.serif{font-family:var(--serif)}
.mute{color:var(--mute)}
.us{color:var(--accent);font-weight:300}

/* family colour scopes */
.vis{--fc:var(--vis)}.lid{--fc:var(--lid)}.fus{--fc:var(--fus)}.spc{--fc:var(--spc)}.lrn{--fc:var(--lrn)}.swm{--fc:var(--swm)}.inf{--fc:var(--inf)}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 10px;border:1.5px solid var(--fc,var(--ink));color:var(--fc,var(--ink));border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--bg)}
.tag.solid{background:var(--fc);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:var(--soft);font-size:12.5px;font-weight:500;white-space:nowrap;text-decoration:none}
a.chip:hover{background:var(--soft-2)}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;font-size:14px;font-weight:500;text-decoration:none;white-space:nowrap;transition:background .15s,transform .15s}
.btn-primary{background:var(--ink);color:#fff}.btn-primary:hover{background:#000}
.btn-tonal{background:var(--soft);color:var(--ink)}.btn-tonal:hover{background:var(--soft-2)}
.btn-sm{height:32px;padding:0 13px;font-size:12.5px}
.btn.on{background:var(--ink);color:#fff}

/* nav */
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--hair)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:52px;gap:20px}
.brand{font-weight:800;font-size:15px;letter-spacing:-.01em;text-decoration:none;white-space:nowrap}
.brand b{color:var(--accent);font-weight:300}
.nav-links{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{font-size:13px;text-decoration:none;padding:6px 9px;border-radius:999px;white-space:nowrap;color:var(--ink)}
.nav-links a:hover{background:var(--soft)}
.nav-links a.active{background:var(--ink);color:#fff}
.nav-count{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;margin-left:4px}

/* masthead */
.mast{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding:28px 0 0}
.mast h6{margin:0 0 10px;font-size:12.5px;font-weight:600}
.mast p{margin:0;font-size:12.5px;color:var(--mute);line-height:1.45}
@media (max-width:760px){.mast{grid-template-columns:1fr 1fr}}

/* particle headings */
.pt{position:relative;display:block;width:100%;touch-action:pan-y}
.pt canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.pt .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

/* sections */
section.sec{padding:110px 0 30px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;border-bottom:1px solid var(--hair);padding-bottom:16px}
.sec-head .pt{flex:1;max-width:1000px}
.sec-head .idx{font-family:var(--display);font-weight:200;font-size:clamp(48px,7vw,104px);line-height:.8;color:var(--soft-3);letter-spacing:-.04em;font-stretch:80%;white-space:nowrap}
.sec-sub{display:grid;grid-template-columns:260px 1fr;gap:40px;padding:18px 0 34px}
.sec-sub .k{font-size:12.5px;color:var(--mute);line-height:1.45}
.sec-sub .lede{font-family:var(--serif);font-size:clamp(22px,2.3vw,30px);line-height:1.2;margin:0;max-width:820px}
.sec-sub .lede em{color:var(--mute)}
@media (max-width:760px){.sec-sub{grid-template-columns:1fr;gap:10px}}

/* cards */
.card{background:var(--soft);border-radius:var(--r-lg);padding:22px}
.card.white{background:#fff;border:1px solid var(--hair)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* hero */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;padding-top:34px;align-items:start}
.figbox{background:var(--soft);border-radius:var(--r-xl);padding:14px}
.figbox .stage{position:relative;background:#fff;border-radius:18px;overflow:hidden}
.figbox canvas{display:block;width:100%}
.figcap{display:flex;justify-content:space-between;gap:12px;padding:10px 6px 2px;font-size:11.5px;color:var(--mute);font-family:var(--mono)}
.hero h2.big{font-family:var(--serif);font-weight:400;font-size:clamp(28px,3.1vw,44px);line-height:1.08;margin:0 0 26px;letter-spacing:-.005em}
.hero h2.big em{color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:34px}
.stat{background:var(--soft);border-radius:var(--r-md);padding:12px 12px 10px}
.stat span{display:block;font-size:11px;color:var(--mute)}
.stat b{display:block;font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.05;font-stretch:90%}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mute);margin-top:10px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.toggles{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

/* brief block */
.brief{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:22px}
.brief .card h4{margin:0 0 8px;font-size:15px}
.brief .card p{margin:0;font-size:13.5px;color:var(--mute)}
@media (max-width:900px){.brief{grid-template-columns:1fr}}

/* constraint gauges */
.gauge-row{display:grid;grid-template-columns:150px 1fr 60px;gap:12px;align-items:center;font-size:13px;padding:7px 0;border-bottom:1px solid var(--hair)}
.gauge-row:last-child{border-bottom:0}
.bar{height:8px;border-radius:99px;background:var(--soft-2);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--fc,var(--ink))}

/* environments */
.env{position:relative;overflow:hidden;min-height:250px;display:flex;flex-direction:column}
.env canvas{width:100%;height:120px;display:block;border-radius:12px;background:#fff;margin-bottom:14px}
.env h4{margin:0 0 6px;font-size:16px}
.env p{margin:0 0 10px;font-size:13px;color:var(--mute)}
.env .fails{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
.pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:#fff;border:1px solid var(--hair)}
.pill.bad{color:var(--bad);border-color:#f3c2be}.pill.ok{color:var(--ok);border-color:#b7dfc3}.pill.warn{color:var(--warn);border-color:#f0d29d}

/* heatmap */
.heat{width:100%;border-collapse:separate;border-spacing:3px;font-size:12.5px}
.heat th{font-weight:600;text-align:left;padding:6px 8px;white-space:nowrap}
.heat thead th{font-size:11.5px;color:var(--mute);font-weight:500;vertical-align:bottom}
.heat td{height:42px;border-radius:8px;text-align:center;font-weight:600;font-size:12px;cursor:default;position:relative;transition:transform .12s}
.heat td:hover{transform:scale(1.06);z-index:2;box-shadow:var(--shadow)}
.heat .rowh{min-width:170px}
.heat .rowh small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tip{position:fixed;z-index:200;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;line-height:1.4;padding:10px 12px;border-radius:12px;max-width:320px;box-shadow:var(--shadow);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.tip.on{opacity:1;transform:none}
.tip b{display:block;margin-bottom:2px}

/* pipeline */
.pipe-wrap{background:var(--soft);border-radius:var(--r-xl);padding:14px}
.pipe-stage{background:#fff;border-radius:18px;position:relative;overflow:hidden}
.pipe-stage canvas{display:block;width:100%}
.pipe-info{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:20px 8px 6px}
.pipe-info h4{margin:0 0 4px;font-size:18px}
.pipe-info p{margin:0;color:var(--mute);font-size:14px}
@media (max-width:760px){.pipe-info{grid-template-columns:1fr}}

/* methods grid */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.filters .btn small{opacity:.55;font-weight:600;margin-left:2px}
.mcards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:1000px){.mcards{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.mcards{grid-template-columns:1fr}}
.mcard{background:var(--soft);border-radius:var(--r-lg);padding:18px 18px 14px;display:flex;flex-direction:column;cursor:pointer;transition:background .15s,transform .15s;min-height:250px;position:relative}
.mcard:hover{background:var(--soft-2)}
.mcard .top{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mute)}
.mcard .top .yr{margin-left:auto;font-family:var(--mono)}
.mcard h3{font-size:30px;line-height:1;margin:16px 0 4px;letter-spacing:-.025em;font-weight:700;font-stretch:92%}
.mcard .sens{font-size:11.5px;color:var(--mute)}
.mcard .hook{font-family:var(--serif);font-size:19px;line-height:1.15;margin:12px 0 14px}
.mcard .bot{display:flex;align-items:center;gap:10px;margin-top:auto}
.mcard .bot .kind{font-size:11.5px;color:var(--mute)}
.mcard .fit{position:absolute;top:14px;right:14px}
.minibars{display:flex;align-items:flex-end;gap:2px;height:16px}
.minibars i{width:4px;background:var(--ink);border-radius:1px}
.cmp-btn{margin-left:auto;height:28px;padding:0 11px;border-radius:99px;background:#fff;font-size:12px;font-weight:500;border:1px solid var(--hair)}
.cmp-btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.fitbadge{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:99px;background:#fff;border:1px solid var(--hair)}
.fitbadge.hi{background:var(--ok);color:#fff;border-color:var(--ok)}
.fitbadge.mid{background:#fff3df;color:var(--warn);border-color:#f0d29d}

/* charts */
.chart-card{background:var(--soft);border-radius:var(--r-xl);padding:20px}
.chart-card h4{margin:0 0 2px;font-size:17px}
.chart-card .cap{font-size:12.5px;color:var(--mute);margin:0 0 12px}
.chart-card .plot{background:#fff;border-radius:16px;padding:10px;position:relative}
.chart-card canvas{width:100%;display:block}
.chart-card .src{font-size:11.5px;color:var(--mute);margin-top:10px}
.chart-card .src a{color:var(--accent)}
.seg{display:inline-flex;background:#fff;border-radius:999px;padding:3px;gap:2px;border:1px solid var(--hair)}
.seg button{height:28px;padding:0 11px;border-radius:99px;font-size:12px;font-weight:500}
.seg button.on{background:var(--ink);color:#fff}

/* compare */
.cmp-grid{display:grid;grid-template-columns:420px 1fr;gap:14px}
@media (max-width:1000px){.cmp-grid{grid-template-columns:1fr}}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--hair);vertical-align:top}
.tbl thead th{font-size:12px;font-weight:600;position:sticky;top:0;background:#fff}
.tbl td.k{color:var(--mute);font-size:12px;white-space:nowrap;width:140px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.lvl{display:inline-flex;gap:2px;vertical-align:middle}
.lvl i{width:12px;height:6px;border-radius:2px;background:var(--soft-3)}
.lvl i.f{background:var(--fc,var(--ink))}

/* fit configurator */
.cfg{display:grid;grid-template-columns:380px 1fr;gap:14px}
@media (max-width:1000px){.cfg{grid-template-columns:1fr}}
.cfg .q{margin-bottom:18px}
.cfg .q h5{margin:0 0 8px;font-size:12.5px;font-weight:600}
.cfg .q .opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{height:30px;padding:0 12px;border-radius:99px;background:#fff;border:1px solid var(--hair);font-size:12.5px;font-weight:500}
.opt.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.rank{display:flex;flex-direction:column;gap:8px}
.rk{display:grid;grid-template-columns:34px 1fr 150px;gap:14px;align-items:center;background:#fff;border-radius:16px;padding:12px 14px;cursor:pointer;border:1px solid transparent;transition:border-color .15s}
.rk:hover{border-color:var(--hair)}
.rk .n{font-family:var(--mono);font-size:12px;color:var(--mute)}
.rk h5{margin:0;font-size:16px}
.rk p{margin:2px 0 0;font-size:12.5px;color:var(--mute)}
.rk .why{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.rk .why span{font-size:10.5px;padding:2px 7px;border-radius:99px;background:var(--soft)}
.rk .why span.neg{background:#fde8e6;color:var(--bad)}
.rk .why span.pos{background:#e6f4ea;color:var(--ok)}
.score{height:8px;border-radius:99px;background:var(--soft-2);position:relative;overflow:hidden}
.score i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent)}
.rk .sc{font-family:var(--mono);font-size:11px;text-align:right;margin-bottom:4px}
.rk.excluded{opacity:.42}

/* lineage */
.lineage-wrap{background:var(--soft);border-radius:var(--r-xl);padding:14px}
.lineage-wrap .stage{background:#fff;border-radius:18px;overflow-x:auto}
.lineage-wrap svg{display:block}
.lin-node{cursor:pointer}
.lin-node rect{transition:fill .15s}
.lin-node:hover rect{fill:var(--soft-2)}

/* failure atlas */
.atlas td.c{text-align:center;font-size:15px}
.sym-ok{color:var(--ok)}.sym-mid{color:var(--warn)}.sym-bad{color:var(--bad)}

/* stack / builds */
.build{display:flex;flex-direction:column}
.build h4{margin:0;font-size:20px;letter-spacing:-.01em}
.build .price{font-family:var(--mono);font-size:12px;color:var(--mute);margin:4px 0 12px}
.build ul{margin:0;padding:0;list-style:none;font-size:13px}
.build li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--hair)}
.build li span:last-child{color:var(--mute);text-align:right}
.build .runs{margin-top:12px;display:flex;flex-wrap:wrap;gap:5px}

/* datasets */
.ds{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:1000px){.ds{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.ds{grid-template-columns:1fr}}
.ds .card h4{margin:0 0 2px;font-size:17px}
.ds .card .yr{font-family:var(--mono);font-size:11px;color:var(--mute)}
.ds .card p{font-size:13px;color:var(--mute);margin:8px 0 10px}
.sensrow{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.sensrow span{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:99px;background:#fff;border:1px solid var(--hair)}

/* roadmap */
.road{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:1000px){.road{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.road{grid-template-columns:1fr}}
.road .card h5{margin:0 0 2px;font-size:11.5px;color:var(--mute);font-weight:500;font-family:var(--mono)}
.road .card h4{margin:0 0 10px;font-size:17px}
.road ol{margin:0;padding-left:18px;font-size:13px}
.road li{margin:0 0 6px}
.gap{display:grid;grid-template-columns:44px 1fr 220px;gap:18px;padding:18px 0;border-bottom:1px solid var(--hair);align-items:start}
.gap .n{font-family:var(--display);font-size:34px;font-weight:200;color:var(--mute-2);line-height:1}
.gap h4{margin:0 0 4px;font-size:18px}
.gap p{margin:0 0 8px;font-size:14px;color:var(--mute)}
.gap .meta{font-size:12px}
.gap .meta div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--hair)}
@media (max-width:760px){.gap{grid-template-columns:1fr}}

/* sources */
.srcs{columns:2;column-gap:40px}
@media (max-width:760px){.srcs{columns:1}}
.srcs .s{break-inside:avoid;padding:12px 0;border-bottom:1px solid var(--hair);font-size:13px}
.srcs .s b{display:block;font-size:13.5px}
.srcs .s .links{display:flex;gap:10px;margin-top:4px;font-size:12px}
.srcs .s .links a{color:var(--accent);text-decoration:none}

footer{padding:60px 0 80px;color:var(--mute);font-size:12.5px}

/* detail overlay */
.detail{position:fixed;inset:0;z-index:100;background:#fff;overflow-y:auto;overscroll-behavior:contain;opacity:0;transform:translateY(16px);transition:opacity .2s,transform .2s;pointer-events:none}
.detail.on{opacity:1;transform:none;pointer-events:auto}
.dbar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--hair)}
.dbar .wrap{display:flex;align-items:center;height:52px;gap:8px}
.dbar .sp{flex:1}
.dhead{padding:34px 0 0}
.dhead .meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute);font-family:var(--mono)}
.dhead .ptitle{margin:14px 0 8px}
.dhead .ttl{font-family:var(--serif);font-size:clamp(22px,2.4vw,32px);line-height:1.12;margin:18px 0 6px;max-width:760px}
.dhead .auth{font-size:12.5px;color:var(--mute)}
.specs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:22px}
.specs div{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:12.5px;line-height:1.35}
.specs div span{display:block;font-size:11px;color:var(--mute);margin-bottom:4px}
@media (max-width:1000px){.specs{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.specs{grid-template-columns:1fr 1fr}}

<body>
<div id="root"></div>
<script>
/* ---------- core helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL = {
  ink: '#1d1d1f', mute: '#6e6e73', hair: '#e3e3e8', soft: '#f5f5f7', soft2: '#ececf0',
  vis: '#1a73e8', lid: '#d93025', fus: '#188038', spc: '#9334e6', lrn: '#e37400', swm: '#00838f', inf: '#5f6368',
  ok: '#188038', warn: '#b06000', bad: '#d93025'
};
const FAM = {
  vio: { label: 'Visual-inertial', short: 'VIO', cls: 'vis', col: COL.vis },
  lio: { label: 'LiDAR-inertial', short: 'LIO', cls: 'lid', col: COL.lid },
  livo: { label: 'LiDAR-visual-inertial', short: 'LIVO', cls: 'fus', col: COL.fus },
  deg: { label: 'Degraded-sensing', short: 'Thermal / Radar / Event', cls: 'spc', col: COL.spc },
  lrn: { label: 'Learned & dense', short: 'Learned', cls: 'lrn', col: COL.lrn },
  swm: { label: 'Multi-drone', short: 'Swarm', cls: 'swm', col: COL.swm },
};
// seeded rng
function rng(seed = 1) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function gauss(r) { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); }

/* ---------- canvas with DPR + visibility-gated RAF ---------- */
const running = new Set();
function makeCanvas(parent, aspect = 0.5, minH = 220, maxH = 620) {
  const c = h('canvas');
  parent.append(c);
  const ctx = c.getContext('2d');
  const st = { c, ctx, w: 0, h: 0, dpr: 1, aspect, minH, maxH, visible: false };
  const fit = () => {
    const w = parent.clientWidth || 600;
    const hh = clamp(Math.round(w * aspect), minH, maxH);
    st.dpr = Math.min(2, window.devicePixelRatio || 1);
    c.width = Math.round(w * st.dpr); c.height = Math.round(hh * st.dpr);
    c.style.height = hh + 'px';
    st.w = w; st.h = hh;
    ctx.setTransform(st.dpr, 0, 0, st.dpr, 0, 0);
    st.onresize && st.onresize();
  };
  st.fit = fit;
  fit();
  new ResizeObserver(() => fit()).observe(parent);
  return st;
}
const visObs = new IntersectionObserver((ents) => {
  for (const e of ents) { const s = e.target.__sim; if (s) s.visible = e.isIntersecting; }
}, { rootMargin: '120px' });
function animate(st, step) {
  st.c.__sim = st; visObs.observe(st.c);
  st.t = 0; st.paused = false;
  let last = performance.now();
  const loop = (now) => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (st.visible && !st.paused && !document.hidden && st.c.isConnected) { st.t += dt; step(st, dt); }
    if (st.c.isConnected || st.keep) st.raf = requestAnimationFrame(loop);
  };
  st.raf = requestAnimationFrame(loop);
  return st;
}

/* ---------- tooltip ---------- */
const tip = h('div', { class: 'tip' });
document.addEventListener('DOMContentLoaded', () => document.body.append(tip));
function showTip(html, x, y) {
  tip.innerHTML = html; tip.classList.add('on');
  const r = tip.getBoundingClientRect();
  let tx = x + 14, ty = y + 14;
  if (tx + r.width > innerWidth - 10) tx = x - r.width - 14;
  if (ty + r.height > innerHeight - 10) ty = y - r.height - 14;
  tip.style.left = tx + 'px'; tip.style.top = ty + 'px';
}
function hideTip() { tip.classList.remove('on'); }
function bindTip(el, html) {
  el.addEventListener('mousemove', (e) => showTip(typeof html === 'function' ? html() : html, e.clientX, e.clientY));
  el.addEventListener('mouseleave', hideTip);
}

/* ---------- dot-matrix particle text (matches SLAM/INDEX headings) ---------- */
function particleText(text, { size = 140, weight = 600, accent = true, stretch = 88, align = 'left', color = COL.ink, minSize = 44 } = {}) {
  const box = h('div', { class: 'pt' });
  const sr = h('span', { class: 'sr' }, text);
  const c = h('canvas');
  box.append(c, sr);
  let pts = [], W = 0, H = 0, dpr = 1, mouse = { x: -1e4, y: -1e4 }, raf = 0, fs = size, settled = false;
  const ctx = c.getContext('2d');
  const build = () => {
    W = box.clientWidth || 800;
    fs = clamp(Math.min(size, W / (text.length * 0.56 + (accent ? 0.7 : 0))), minSize, size);
    H = Math.round(fs * 1.02);
    box.style.height = H + 'px';
    dpr = Math.min(2, devicePixelRatio || 1);
    c.width = W * dpr; c.height = H * dpr;
    const off = document.createElement('canvas'); off.width = W; off.height = H;
    const o = off.getContext('2d');
    o.fillStyle = '#000';
    o.font = `${weight} ${stretch}% ${fs}px Archivo, "Helvetica Neue", Arial, sans-serif`;
    try { o.fontStretch = stretch < 88 ? 'condensed' : stretch < 100 ? 'semi-condensed' : 'normal'; } catch (e) { }
    o.textBaseline = 'alphabetic';
    o.font = `${weight} ${fs}px Archivo, "Helvetica Neue", Arial, sans-serif`;
    let tw = o.measureText(text).width;
    const scaleX = Math.min(1, (W - (accent ? fs * 0.62 : 0)) / tw);
    o.save(); o.scale(scaleX, 1);
    const x0 = align === 'left' ? 0 : (W - tw * scaleX) / 2 / scaleX;
    o.fillText(text, x0, fs * 0.8); o.restore();
    const endX = x0 * scaleX + tw * scaleX;
    const data = o.getImageData(0, 0, W, H).data;
    const step = Math.max(3, Math.round(fs / 34));
    pts = [];
    for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step) {
      if (data[(y * W + x) * 4 + 3] > 128) pts.push({ hx: x, hy: y, x, y, vx: 0, vy: 0, a: 0 });
    }
    if (accent) {
      const ux = endX + fs * 0.06, uy = fs * 0.72, uw = fs * 0.5, uh = fs * 0.09;
      for (let y = uy; y < uy + uh; y += step * 0.8) for (let x = ux; x < ux + uw; x += step * 0.8) pts.push({ hx: x, hy: y, x, y, vx: 0, vy: 0, a: 1 });
    }
    pts.r = step * 0.42;
    settled = false; kick();
  };
  const draw = () => {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    let moving = false;
    const R = fs * 0.5;
    for (const p of pts) {
      const dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx * dx + dy * dy;
      if (d2 < R * R) { const d = Math.sqrt(d2) || 1, f = (1 - d / R) * 2.2; p.vx += dx / d * f; p.vy += dy / d * f; }
      p.vx += (p.hx - p.x) * 0.09; p.vy += (p.hy - p.y) * 0.09;
      p.vx *= 0.78; p.vy *= 0.78; p.x += p.vx; p.y += p.vy;
      if (Math.abs(p.vx) + Math.abs(p.vy) > 0.02 || Math.abs(p.x - p.hx) > 0.2) moving = true;
    }
    ctx.fillStyle = color; ctx.beginPath();
    for (const p of pts) if (!p.a) { ctx.moveTo(p.x + pts.r, p.y); ctx.arc(p.x, p.y, pts.r, 0, TAU); }
    ctx.fill();
    ctx.fillStyle = COL.vis; ctx.beginPath();
    for (const p of pts) if (p.a) { ctx.moveTo(p.x + pts.r * .8, p.y); ctx.arc(p.x, p.y, pts.r * .8, 0, TAU); }
    ctx.fill();
    if (moving) raf = requestAnimationFrame(draw); else raf = 0;
  };
  const kick = () => { if (!raf) raf = requestAnimationFrame(draw); };
  box.addEventListener('pointermove', (e) => { const r = box.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; kick(); });
  box.addEventListener('pointerleave', () => { mouse.x = mouse.y = -1e4; kick(); });
  const ro = new ResizeObserver(() => build());
  requestAnimationFrame(() => { (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { build(); ro.observe(box); }); });
  return box;
}

function sectionHead(name, idx, k, lede) {
  return h('div', {},
    h('div', { class: 'sec-head' }, particleText(name, { size: 140 }), idx ? h('div', { class: 'idx' }, idx) : null),
    h('div', { class: 'sec-sub' }, h('div', { class: 'k' }, k), h('p', { class: 'lede', html: lede }))
  );
}

/* reveal on scroll */
const revObs = new IntersectionObserver((ents) => { for (const e of ents) if (e.isIntersecting) { e.target.classList.add('in'); revObs.unobserve(e.target); } }, { rootMargin: '-40px' });

/* small drawing helpers */
function drone(ctx, x, y, ang, s = 1, col = COL.ink) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s);
  ctx.strokeStyle = col; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(-7, -7); ctx.lineTo(7, 7); ctx.moveTo(-7, 7); ctx.lineTo(7, -7); ctx.stroke();
  ctx.fillStyle = col;
  for (const [a, b] of [[-7, -7], [7, 7], [-7, 7], [7, -7]]) { ctx.beginPath(); ctx.arc(a, b, 3.6, 0, TAU); ctx.globalAlpha = .18; ctx.fill(); ctx.globalAlpha = 1; ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(3.5, -3.2); ctx.lineTo(3.5, 3.2); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, 2.6, 0, TAU); ctx.fill();
  ctx.restore();
}
function hud(ctx, lines, x = 12, y = 18, col = COL.mute) {
  ctx.font = '500 10.5px "JetBrains Mono", monospace'; ctx.fillStyle = col; ctx.textBaseline = 'alphabetic';
  lines.forEach((l, i) => ctx.fillText(l, x, y + i * 14));
}
function label(ctx, txt, x, y, col = COL.mute, align = 'left', size = 10.5, weight = 500) {
  ctx.font = `${weight} ${size}px "JetBrains Mono", monospace`; ctx.fillStyle = col; ctx.textAlign = align;
  const W = ctx.canvas.width / (ctx.getTransform().a || 1); const maxW = align === 'left' ? W - x - 8 : align === 'right' ? x - 8 : W - 16;
  ctx.fillText(txt, x, y, Math.max(40, maxW)); ctx.textAlign = 'left';
}
function rrect(ctx, x, y, w, hh, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + hh, r); ctx.arcTo(x + w, y + hh, x, y + hh, r); ctx.arcTo(x, y + hh, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }

/* ray-cast against segment list */
function raycast(ox, oy, ang, segs, max = 1e4) {
  const dx = Math.cos(ang), dy = Math.sin(ang); let best = max, hit = null;
  for (const s of segs) {
    const [x1, y1, x2, y2] = s; const ex = x2 - x1, ey = y2 - y1;
    const den = dx * ey - dy * ex; if (Math.abs(den) < 1e-9) continue;
    const t = ((x1 - ox) * ey - (y1 - oy) * ex) / den; const u = ((x1 - ox) * dy - (y1 - oy) * dx) / den;
    if (t > 0 && u >= 0 && u <= 1 && t < best) { best = t; hit = s; }
  }

}
function rectSegs(x, y, w, hh) { return [[x, y, x + w, y], [x + w, y, x + w, y + hh], [x + w, y + hh, x, y + hh], [x, y + hh, x, y]]; }

/* =====================================================================
   MISSION ENGINE — one GPS-denied flight, many estimators.
   Illustrative model: estimator error grows according to how well each
   sensor is constrained at that moment (computed from the geometry).
   It is a teaching simulation, not measured data.
   ===================================================================== */
const WORLD = (() => {
  const W = 40, H = 22;
  const segs = [];
  const add = (x1, y1, x2, y2, tex, kind = 'wall') => segs.push({ x1, y1, x2, y2, tex, kind });
  // outer shell

/* =====================================================================

/* ---------- estimator structure: factor graphs, filters, maps ---------- */
function graphSim(parent, type = 'window', o = {}) {
  const st = makeCanvas(parent, 0.42, 260, 420);
  const N = o.window || 10;
  let kfs = [], lms = [], nextId = 0, timer = 0, flash = [], loopT = -10, merged = 0, mapPts = [];
  const r = rng(11);
  const addKF = () => {
    const id = nextId++;
    const prevY = kfs.length ? kfs[kfs.length - 1].y : 0;
    const kf = { id, born: st.t, marg: false, map: (type === 'atlas' && id >= 9 && id < 15 && !merged) ? 1 : 0, y: prevY + (r() - .35) * 4.5, robot: id % 3 };
    kfs.push(kf);
    const nl = type === 'msckf' ? 3 : 4;
    for (let i = 0; i < nl; i++) lms.push({ x: id + (r() - .5) * 2.5, y: -60 - r() * 70, kf: id, life: 2 + Math.floor(r() * 4), born: st.t, slam: type === 'msckf' && r() < .12 });
    if (type === 'window' || type === 'atlas') { const act = kfs.filter(k => !k.marg); if (act.length > N) { act[0].marg = true; flash.push({ t: st.t, id: act[0].id, kind: 'marg' }); } }
    if (type === 'msckf') { const act = kfs.filter(k => !k.marg); if (act.length > (o.clones || 11)) { act[0].marg = true; flash.push({ t: st.t, id: act[0].id, kind: 'drop' }); } }
    if ((type === 'window' && o.loop || type === 'isam' || type === 'atlas') && id > 0 && id % 22 === 0) { loopT = st.t; const to = id - 18; const k0 = kfs.find(k => k.id === to); const dy = kf.y - (k0 ? k0.y : 0); for (const k of kfs) { const wgt = k.id <= to ? 0 : (k.id - to) / (id - to); k.corr = dy * wgt; k.y0 = k.y; } flash.push({ t: st.t, id, kind: 'loop', to }); if (type === 'atlas') merged = 1; }
    if (kfs.length > 60) kfs.shift();
  };
  st.t = 0; for (let i = 0; i < 24; i++) addKF();
  for (const l of lms) l.born = -5;
  flash = [];
  animate(st, (st, dt) => {
    const { ctx, w, h } = st; ctx.clearRect(0, 0, w, h);
    timer += dt; const per = type === 'pointwise' ? .7 : .75;
    if (timer > per) { timer = 0; addKF(); }
    const span = type === 'isam' ? 30 : 22;
    const last = nextId - 1 + timer / per;
    const X = (i) => w - 60 - (last - i) * (w - 120) / span;
    const baseY = h * .66;
    const ec = clamp((st.t - loopT - .3) / 1, 0, 1), ee = ec * ec * (3 - 2 * ec);
    for (const k of kfs) if (k.corr != null) { k.y = k.y0 - k.corr * ee; if (ec >= 1) { k.corr = null; } }
    const Y = (k) => baseY + (type === 'msckf' || (type === 'window' && !o.loop) ? 0 : k.y);
    // ---- per type ----
    if (type === 'ieskf' || type === 'pointwise') {
      // map grid (ikd-tree / voxels) and a single state
      const cell = 12, cols = Math.floor((w - 40) / cell), mapH = Math.floor(h * .34 / cell) * cell;
      ctx.fillStyle = COL.soft; ctx.fillRect(20, 30, cols * cell, mapH);
      while (mapPts.length < Math.min(400, nextId * 9)) mapPts.push({ c: Math.floor(r() * cols), rr: Math.floor(r() * (mapH / cell)), t: st.t });
      for (const p of mapPts) { const a = clamp((st.t - p.t) * 2, 0, 1); ctx.fillStyle = hexA(COL.lid, .25 + .45 * a); ctx.fillRect(20 + p.c * cell + 1, 30 + p.rr * cell + 1, cell - 2, cell - 2); }
      label(ctx, type === 'ieskf' ? 'MAP · incremental k-d tree / voxels (points inserted, never re-optimised)' : 'MAP · incremental voxels', 20, 22, COL.mute);
      // timeline of LiDAR points
      const ty = h - 50; ctx.strokeStyle = COL.hair; ctx.beginPath(); ctx.moveTo(20, ty); ctx.lineTo(w - 20, ty); ctx.stroke();
      const rate = type === 'pointwise' ? 1 : 10;
      const n = Math.floor((w - 40) / 6);
      for (let i = 0; i < n; i++) {
        const x = 20 + i * 6; const tt = st.t - (n - i) * .012;
        ctx.fillStyle = COL.lid; ctx.fillRect(x, ty - 8, 2, 8);
        const isUpd = type === 'pointwise' ? true : (Math.floor(tt * 100) % 10 === 0);
        if (isUpd) { ctx.fillStyle = COL.ink; ctx.beginPath(); ctx.arc(x + 1, ty + 12, type === 'pointwise' ? 1.4 : 3.5, 0, TAU); ctx.fill(); }
      }
      label(ctx, 'LiDAR points arriving →', 20, ty - 14, COL.mute);
      label(ctx, type === 'pointwise' ? '● state update after EVERY point (no scan accumulation, no de-skew)' : '● state update once per scan (iterated EKF), then points inserted into map', 20, ty + 30, COL.ink);
      // state node
      const sx = 40, sy = Math.round((30 + mapH + h - 50) / 2) - 6;
      ctx.fillStyle = COL.ink; ctx.beginPath(); ctx.arc(sx, sy, 14, 0, TAU); ctx.fill();
      label(ctx, 'x̂', sx, sy + 4, '#fff', 'center', 12, 700);
      label(ctx, 'one state: pose, velocity, biases, gravity  (+ covariance P)', sx + 22, sy + 4, COL.mute);
      const it = Math.floor(st.t * (type === 'pointwise' ? 20 : 4)) % 4;
      ctx.strokeStyle = COL.lid; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(sx, sy, 20 + it * 3, 0, TAU); ctx.stroke();
      return;
    }
    if (type === 'dba') {
      // frame graph with dense flow edges (DROID / DPVO)
      const act = kfs.slice(-12);
      act.forEach((k, i) => {
        for (let j = Math.max(0, i - 3); j < i; j++) { const k2 = act[j]; const wgt = 1 - (i - j) / 4; ctx.strokeStyle = hexA(COL.lrn, .15 + .5 * wgt); ctx.lineWidth = 1 + 3 * wgt; ctx.beginPath(); ctx.moveTo(X(k.id), baseY); ctx.quadraticCurveTo((X(k.id) + X(k2.id)) / 2, baseY - 30 - (i - j) * 18, X(k2.id), baseY); ctx.stroke(); }
      });
      act.forEach(k => { ctx.fillStyle = '#fff'; ctx.strokeStyle = COL.ink; ctx.lineWidth = 1.5; rrect(ctx, X(k.id) - 12, baseY - 9, 24, 18, 4); ctx.fill(); ctx.stroke(); for (let i = 0; i < 6; i++) { ctx.fillStyle = hexA(COL.lrn, .6); ctx.fillRect(X(k.id) - 9 + (i % 3) * 7, baseY - 6 + Math.floor(i / 3) * 7, 4, 4); } });
      label(ctx, 'FRAME GRAPH · edges = dense optical flow (thicker = higher learned confidence)', 20, 22, COL.mute);
      label(ctx, `update ${1 + Math.floor(st.t * 6) % 8}/8 · ConvGRU refines flow → differentiable bundle adjustment solves poses + depth`, 20, h - 22, COL.ink);
      return;
    }
    if (type === 'distributed') {
      const robots = [COL.vis, COL.lid, COL.fus];
      const rows = [h * .28, h * .52, h * .76];
      kfs.slice(-36).forEach(k => { const ry = rows[k.robot]; ctx.fillStyle = robots[k.robot]; ctx.beginPath(); ctx.arc(X(k.id), ry, 4.5, 0, TAU); ctx.fill(); });
      rows.forEach((ry, i) => { ctx.strokeStyle = hexA(robots[i], .4); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(40, ry); ctx.lineTo(w - 60, ry); ctx.stroke(); label(ctx, `UAV ${i + 1}`, 14, ry + 4, robots[i], 'left', 10, 700); });
      const ph = (st.t % 3) / 3;
      const ids = kfs.slice(-36).map(k => k.id);
      if (ids.length > 10) {
        const a = ids[ids.length - 8], b = ids[ids.length - 5];
        const ka = kfs.find(k => k.id === a), kb = kfs.find(k => k.id === b);
        if (ka && kb && ka.robot !== kb.robot) {
          ctx.strokeStyle = COL.swm; ctx.lineWidth = 2; ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(X(a), rows[ka.robot]); ctx.lineTo(X(b), rows[kb.robot]); ctx.stroke(); ctx.setLineDash([]);
          const mx = lerp(X(a), X(b), ph), my = lerp(rows[ka.robot], rows[kb.robot], ph); ctx.fillStyle = COL.swm; ctx.fillRect(mx - 4, my - 3, 8, 6);
        }
      }
      label(ctx, 'DISTRIBUTED POSE GRAPH · each UAV keeps its own graph; dashed = inter-robot loop closure (compact descriptor sent, then verified)', 20, 18, COL.mute);
      return;
    }
    // ---- keyframe graphs: window / msckf / isam / atlas ----
    const vis = kfs.filter(k => X(k.id) > -20);
    // landmarks + visual factors
    if (type !== 'isam') for (const l of lms) {
      if (X(l.x) < -20) continue;
      const kf = kfs.find(k => k.id === l.kf); if (!kf) continue;
      const age = (nextId - 1) - l.kf; const alive = age < l.life;
      if (type === 'msckf' && !alive && !l.slam) continue;
      const lx = X(l.x), ly = baseY + l.y;
      if (alive) { ctx.strokeStyle = hexA(COL.vis, .35); ctx.lineWidth = 1; ctx.beginPath(); for (let j = l.kf; j <= Math.min(nextId - 1, l.kf + l.life); j++) { const k = kfs.find(q => q.id === j); if (k) { ctx.moveTo(lx, ly); ctx.lineTo(X(j), Y(k)); } } ctx.stroke(); }
      ctx.fillStyle = l.slam ? COL.ink : alive ? COL.vis : '#c7c7cc'; ctx.fillRect(lx - 3, ly - 3, 6, 6);
    }

      ctx.strokeStyle = b.marg ? '#c7c7cc' : (type === 'atlas' && b.map ? COL.lrn : COL.ink); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(X(a.id), Y(a)); ctx.lineTo(X(b.id), Y(b)); ctx.stroke();
      if (o.imu !== false) for (let q = 1; q < 6; q++) { const xx = lerp(X(a.id), X(b.id), q / 6), yy = lerp(Y(a), Y(b), q / 6); ctx.strokeStyle = COL.accent; ctx.beginPath(); ctx.moveTo(xx, yy - 4); ctx.lineTo(xx, yy + 4); ctx.stroke(); }

    label(ctx, cap || '', 20, 20, COL.mute);
  });

}

/* ---------- LiDAR scan patterns (spinning vs non-repetitive) ---------- */
function scanSim(parent) {
  const st = makeCanvas(parent, 0.36, 220, 340);
  const pats = [{ name: 'Spinning 16-beam (360°, fixed rings)', kind: 'spin' }, { name: 'Non-repetitive (Livox-style): coverage grows with time', kind: 'nr' }];
  let pts = [[], []]; const r = rng(4);
  animate(st, (st, dt) => {
    const { ctx, w, h } = st; ctx.clearRect(0, 0, w, h);
    const pw = (w - 60) / 2, ph = h - 70;
    const tInt = (st.t % 4);
    if (tInt < dt * 1.5) pts = [[], []];
    pats.forEach((p, i) => {
      const x0 = 20 + i * (pw + 20), y0 = 34;
      ctx.fillStyle = COL.soft; ctx.fillRect(x0, y0, pw, ph);
      label(ctx, p.name, x0, y0 - 10, COL.ink, 'left', 10.5, 600);
      const n = 260;
      for (let k = 0; k < n; k++) {
        if (p.kind === 'spin') { const ring = Math.floor(r() * 16); pts[i].push([r(), (ring + .5) / 16 * .6 + .2]); }
        else { const t = st.t * 3 + k * .013; const a = (Math.sin(t * 7.1) * .5 + .5 + r() * .02) % 1; const e = .5 + .48 * Math.sin(t * 2.3 + Math.sin(t * .7) * 2) * Math.cos(t * 1.3); pts[i].push([(a + st.t * .21 + k / n) % 1, clamp(e, .02, .98)]); }
      }
      if (pts[i].length > 12000) pts[i] = pts[i].slice(-12000);
      ctx.fillStyle = COL.lid;
      for (const q of pts[i]) ctx.fillRect(x0 + q[0] * pw, y0 + q[1] * ph, 1.2, 1.2);
      label(ctx, 'azimuth →', x0 + pw - 60, y0 + ph + 14, COL.mute); label(ctx, 'elevation ↓', x0, y0 + ph + 14, COL.mute);
    });
    label(ctx, `integration time ${tInt.toFixed(1)} s`, w - 20, h - 8, COL.ink, 'right', 10.5, 600);
  });
  return st;
}

/* ---------- radar-inertial: Doppler ego-velocity with RANSAC ---------- */
function radarSim(parent) {
  const st = makeCanvas(parent, 0.42, 280, 440);
  const r = rng(21);
  const fog = Array.from({ length: 140 }, () => ({ x: r(), y: r(), s: 2 + r() * 10, v: .01 + r() * .02 }));
  animate(st, (st, dt) => {
    const { ctx, w, h } = st; ctx.clearRect(0, 0, w, h);
    const half = w * .5;
    // ego velocity varies
    const vx = 1.6 + Math.sin(st.t * .5) * .8, vy = Math.cos(st.t * .37) * .9;
    const cx = half * .3, cy = h * .55, S = Math.min(half, h) * .028;
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, half, h); ctx.clip();
    // fog
    for (const f of fog) { f.x = (f.x + f.v * dt) % 1; ctx.fillStyle = 'rgba(140,140,148,.08)'; ctx.beginPath(); ctx.arc(f.x * half, f.y * h, f.s * 3, 0, TAU); ctx.fill(); }
    label(ctx, 'DENSE FOG · camera & LiDAR blind', 14, 20, COL.mute);
    drone(ctx, cx, cy, Math.atan2(-vy, vx), 1.2);
    ctx.strokeStyle = COL.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + vx * 30, cy - vy * 30); ctx.stroke();
    label(ctx, 'v (true)', cx + vx * 30 + 6, cy - vy * 30, COL.ink);
    // targets
    const targets = []; const rr = rng(Math.floor(st.t * 4) + 3);
    for (let i = 0; i < 26; i++) {

      const kind = i < 3 ? 'moving' : i < 5 ? 'ghost' : 'static';

      if (kind === 'moving') vd += (rr() - .5) * 3; if (kind === 'ghost') vd *= -.6 + rr() * .4;

      const det = Math.cos(a.az) * Math.sin(b.az) - Math.sin(a.az) * Math.cos(b.az); if (Math.abs(det) < .05) continue;
      const ex = (-a.vd * Math.sin(b.az) + b.vd * Math.sin(a.az)) / det, ey = (-b.vd * Math.cos(a.az) + a.vd * Math.cos(b.az)) / det;
      let n = 0; for (const t of targets) if (Math.abs(t.vd + ex * Math.cos(t.az) + ey * Math.sin(t.az)) < .25) n++;
      if (n > bestIn) { bestIn = n; best = [ex, ey]; }
    }
    for (const t of targets) {
      const inl = best && Math.abs(t.vd + best[0] * Math.cos(t.az) + best[1] * Math.sin(t.az)) < .25;
      const px = cx + Math.cos(t.az) * t.rng * S * 2, py = cy - Math.sin(t.az) * t.rng * S * 2;
      ctx.fillStyle = inl ? COL.spc : COL.bad; ctx.beginPath(); ctx.arc(px, py, 3, 0, TAU); ctx.fill();
      ctx.strokeStyle = hexA(inl ? COL.spc : COL.bad, .6); ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(t.az) * t.vd * 8, py - Math.sin(t.az) * t.vd * 8); ctx.stroke();
    }
    ctx.restore();
    // plot
    const px0 = half + 40, px1 = w - 20, py0 = 40, py1 = h - 44, mid = (py0 + py1) / 2;
    ctx.strokeStyle = COL.hair; ctx.beginPath(); ctx.moveTo(px0, mid + 25); ctx.lineTo(px1, mid + 25); ctx.moveTo(px0, py0); ctx.lineTo(px0, py1); ctx.stroke();
    const AX = (az) => px0 + (az + 1.3) / 2.6 * (px1 - px0), AY = (v) => mid + 25 - v / 4.5 * (py1 - py0 - 50) / 2;
    if (best) { ctx.strokeStyle = COL.spc; ctx.lineWidth = 2; ctx.beginPath(); for (let az = -1.3; az <= 1.3; az += .05) { const v = -(best[0] * Math.cos(az) + best[1] * Math.sin(az)); az > -1.3 ? ctx.lineTo(AX(az), AY(v)) : ctx.moveTo(AX(az), AY(v)); } ctx.stroke(); }
    ctx.save(); ctx.beginPath(); ctx.rect(px0, py0 + 50, px1 - px0, py1 - py0 - 50); ctx.clip();
    for (const t of targets) { const inl = best && Math.abs(t.vd + best[0] * Math.cos(t.az) + best[1] * Math.sin(t.az)) < .25; ctx.fillStyle = inl ? COL.spc : COL.bad; ctx.beginPath(); ctx.arc(AX(t.az), AY(t.vd), 3.2, 0, TAU); ctx.fill(); }
    ctx.restore();
    label(ctx, 'Doppler velocity of each return vs azimuth', px0, py0 - 14, COL.ink, 'left', 10.5, 600);
    label(ctx, 'v_r = −(vₓ cos θ + v_y sin θ)  · purple = static inliers, red = moving / multipath (rejected)', px0, py1 + 18, COL.mute);
    label(ctx, 'azimuth θ →', px1, mid + 19, COL.mute, 'right');
    if (best) hud(ctx, [`RANSAC ego-velocity  ${best[0].toFixed(2)}, ${best[1].toFixed(2)} m/s`, `true               ${vx.toFixed(2)}, ${vy.toFixed(2)} m/s`, `inliers ${bestIn}/${targets.length}  → fused with IMU in an EKF`], px0 + 8, py0 + 6, COL.ink);
  });
  return st;
}

/* ---------- event camera vs frame camera during a fast flip / HDR ---------- */
function eventSim(parent) {
  const st = makeCanvas(parent, 0.4, 260, 420);

  let events = [];
  animate(st, (st, dt) => {
    const { ctx, w, h } = st; ctx.clearRect(0, 0, w, h);
    const pw = (w - 60) / 2, ph = h - 70, y0 = 36;
    const om = 6 * Math.sin(st.t * 1.4) ** 3; // angular rate
    const off = (t) => (Math.cos(st.t * 1.4) * .9 + t * om * .02);
    const hdr = (st.t % 8) > 4;
    // frame camera
    const x0 = 20;
    ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, pw, ph); ctx.clip();
    ctx.fillStyle = '#fff'; ctx.fillRect(x0, y0, pw, ph);
    const blurN = Math.min(14, 1 + Math.abs(om) * 3);
    for (let b = 0; b < blurN; b++) {
      const o = off(b / blurN - .5) * pw * .4;
      ctx.fillStyle = `rgba(29,29,31,${1.2 / blurN})`;
      for (const s of shapes) ctx.fillRect(x0 + ((s.x * pw + o) % pw + pw) % pw, y0 + s.y * ph, s.w * pw, s.h * ph);
    }
    if (hdr) { const gr = ctx.createLinearGradient(x0 + pw * .55, 0, x0 + pw, 0); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(.25, 'rgba(255,255,255,.97)'); ctx.fillStyle = gr; ctx.fillRect(x0, y0, pw, ph); ctx.fillStyle = 'rgba(0,0,0,.85)'; ctx.fillRect(x0, y0, pw * .3, ph); }
    ctx.restore();
    label(ctx, `FRAME CAMERA · 30 fps · exposure blur${hdr ? ' · tunnel exit: saturated + crushed' : ''}`, x0, y0 - 10, COL.ink, 'left', 10.5, 600);
    // event camera
    const x1 = x0 + pw + 20;
    ctx.fillStyle = '#fafafa'; ctx.fillRect(x1, y0, pw, ph);
    const o = off(0) * pw * .4;
    const nEv = Math.min(1600, 120 + Math.abs(om) * 260);
    for (let i = 0; i < nEv; i++) {
      const s = shapes[Math.floor(r() * shapes.length)]; const edge = Math.floor(r() * 4);
      let ex = s.x * pw + o, ey = s.y * ph;
      if (edge === 0) { ey += r() * s.h * ph; } else if (edge === 1) { ex += s.w * pw; ey += r() * s.h * ph; } else if (edge === 2) { ex += r() * s.w * pw; } else { ex += r() * s.w * pw; ey += s.h * ph; }
      if (Math.abs(om) < .15 && r() > .08) continue; // static scene → few events
      events.push({ x: ((ex % pw) + pw) % pw, y: ey, p: (edge === 0) === (om > 0), t: st.t });
    }
    events = events.filter(e => st.t - e.t < .03);
    for (const e of events) { ctx.fillStyle = e.p ? COL.vis : COL.bad; ctx.fillRect(x1 + e.x, y0 + e.y, 1.6, 1.6); }
    label(ctx, 'EVENT CAMERA · per-pixel brightness changes, µs latency, >120 dB', x1, y0 - 10, COL.ink, 'left', 10.5, 600);
    hud(ctx, [`angular rate ${Math.abs(om).toFixed(1)} rad/s`, `events in last 30 ms: ${events.length}`, Math.abs(om) < .2 ? 'hovering: almost no events → needs frames/IMU' : 'edges stay sharp'], x1 + 8, y0 + 16, COL.ink);
  });

}

/* ---------- thermal vs visible in smoke + FFC ---------- */
function thermalSim(parent) {
  const st = makeCanvas(parent, 0.4, 260, 420);
  const r = rng(9);
  const objs = Array.from({ length: 22 }, () => ({ x: r(), y: .25 + r() * .7, w: .03 + r() * .1, h: .04 + r() * .2, warm: r() < .45, temp: r() }));
  const puffs = Array.from({ length: 30 }, () => ({ x: r(), y: r(), s: .06 + r() * .14, v: .02 + r() * .05 }));
  animate(st, (st, dt) => {
    const { ctx, w, h } = st; ctx.clearRect(0, 0, w, h);
    const pw = (w - 60) / 2, ph = h - 70, y0 = 36;
    const pan = st.t * .04;
    const ffc = (st.t % 7) > 6.45;
    for (let v = 0; v < 2; v++) {
      const x0 = 20 + v * (pw + 20);
      ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, pw, ph); ctx.clip();
      ctx.fillStyle = v ? '#1b1b22' : '#efeff2'; ctx.fillRect(x0, y0, pw, ph);
      let feats = 0;
      for (const o of objs) {

        if (v === 0) { ctx.fillStyle = '#8e8e93'; ctx.fillRect(ox, oy, o.w * pw, o.h * ph); }
        else { const c = o.warm ? `hsl(${30 + o.temp * 25},95%,${50 + o.temp * 15}%)` : '#3a3a46'; ctx.fillStyle = c; ctx.fillRect(ox, oy, o.w * pw, o.h * ph); }
        // corners as features unless smoke (visible) / FFC (thermal)
        let covered = false;
        for (const p of puffs) { const px = x0 + p.x * pw, py = y0 + p.y * ph; if (Math.hypot(ox - px, oy - py) < p.s * pw * .9) covered = true; }
        const ok = v === 0 ? !covered : (!ffc && o.warm);
        if (ok) { feats++; ctx.strokeStyle = v ? '#fff' : COL.vis; ctx.lineWidth = 1.4; ctx.strokeRect(ox - 3, oy - 3, 6, 6); }
      }
      if (v === 0) for (const p of puffs) { p.x = (p.x + p.v * dt * .4) % 1.2; const gr = ctx.createRadialGradient(x0 + p.x * pw, y0 + p.y * ph, 0, x0 + p.x * pw, y0 + p.y * ph, p.s * pw); gr.addColorStop(0, 'rgba(160,160,166,.92)'); gr.addColorStop(1, 'rgba(160,160,166,0)'); ctx.fillStyle = gr; ctx.fillRect(x0, y0, pw, ph); }
      if (v === 1 && ffc) { ctx.fillStyle = 'rgba(40,40,48,.96)'; ctx.fillRect(x0, y0, pw, ph); label(ctx, 'FLAT-FIELD CORRECTION · shutter closed, image frozen', x0 + pw / 2, y0 + ph / 2, '#fff', 'center', 11, 700); }
      ctx.restore();

      label(ctx, `tracked features ${feats}`, x0, y0 + ph + 16, v ? COL.spc : COL.vis, 'left', 10.5, 700);
    }

  return st;
}

/* ---------- learned dense flow (DROID / DPVO style) ---------- */
function flowSim(parent, mode = 'dense') {
  const st = makeCanvas(parent, 0.42, 260, 420);
  animate(st, (st, dt) => {
    const { ctx, w, h } = st; ctx.clearRect(0, 0, w, h);
    const iter = 1 + Math.floor(st.t * 3) % 8; const conv = 1 - Math.pow(.55, iter);
    const tx = Math.sin(st.t * .4) * .6, rz = Math.cos(st.t * .3) * .4;
    const step = mode === 'patch' ? 46 : 22;
    const pw = w - 40, ph = h - 70;
    ctx.fillStyle = COL.soft; ctx.fillRect(20, 34, pw, ph);
    const r = rng(3);
    for (let y = 34 + step / 2; y < 34 + ph; y += step) for (let x = 20 + step / 2; x < 20 + pw; x += step) {
      const nx = (x - w / 2) / pw, ny = (y - h / 2) / ph; const depth = .6 + .4 * Math.sin(nx * 5) * Math.cos(ny * 4);
      let fx = (tx / depth - rz * ny) * 26, fy = (rz * nx) * 26;
      const noise = (1 - conv) * 14; fx += (r() - .5) * noise; fy += (r() - .5) * noise;
      const conf = clamp(1 - Math.abs(Math.sin(nx * 9 + ny * 7)) * .9 + (r() - .5) * .1, .05, 1);
      ctx.strokeStyle = hexA(COL.lrn, .2 + .8 * conf); ctx.lineWidth = .8 + conf * 1.6;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + fx, y + fy); ctx.stroke();
      if (mode === 'patch') { ctx.strokeStyle = hexA(COL.ink, .5); ctx.lineWidth = 1; ctx.strokeRect(x - 6, y - 6, 12, 12); }
      ctx.fillStyle = COL.lrn; ctx.fillRect(x - 1, y - 1, 2, 2);
    }
    label(ctx, mode === 'patch' ? 'DEEP PATCH VO · flow predicted only for sparse patches (cheaper than dense)' : 'DENSE OPTICAL FLOW between keyframes · line weight = learned confidence', 20, 22, COL.ink, 'left', 10.5, 600);
    hud(ctx, [`GRU update ${iter}/8`, `residual ${(1 - conv).toFixed(2)}`, 'then: dense bundle adjustment (poses + inverse depth)'], 28, 52, COL.ink);
  });
  return st;
}

/* ---------- Gaussian splatting map growth ---------- */
function gaussSim(parent) {
  const st = makeCanvas(parent, 0.38, 240, 380);
  let G = []; const r = rng(17);
  const target = (x, y) => { const v = .5 + .3 * Math.sin(x * 9) * Math.cos(y * 7) + (y > .65 ? .2 : 0) - (Math.hypot(x - .3, y - .4) < .15 ? .4 : 0); return clamp(v, 0, 1); };
  animate(st, (st, dt) => {
    const { ctx, w, h } = st; ctx.clearRect(0, 0, w, h);
    if (G.length < 900 && r() < .9) for (let i = 0; i < 6; i++) { const x = r(), y = r(); G.push({ x, y, s: .02 + r() * .06 * Math.max(.2, 1 - G.length / 900), v: target(x, y), a: r() * Math.PI }); }
    if (G.length >= 900 && (st.t % 6) < dt) G = [];
    const pw = (w - 60) / 2, ph = h - 60, y0 = 34;
    // target image
    for (let i = 0; i < 40; i++) for (let j = 0; j < 30; j++) { const v = target(i / 40, j / 30); ctx.fillStyle = `rgb(${(1 - v) * 230 | 0},${(1 - v) * 230 | 0},${(1 - v) * 236 | 0})`; ctx.fillRect(20 + i * pw / 40, y0 + j * ph / 30, pw / 40 + .5, ph / 30 + .5); }
    label(ctx, 'camera image', 20, y0 - 10, COL.ink, 'left', 10.5, 600);
    const x1 = 40 + pw; ctx.save(); ctx.beginPath(); ctx.rect(x1, y0, pw, ph); ctx.clip(); ctx.fillStyle = '#fff'; ctx.fillRect(x1, y0, pw, ph);
    for (const g of G) { ctx.save(); ctx.translate(x1 + g.x * pw, y0 + g.y * ph); ctx.rotate(g.a); ctx.fillStyle = `rgba(${(1 - g.v) * 230 | 0},${(1 - g.v) * 230 | 0},${(1 - g.v) * 236 | 0},.55)`; ctx.beginPath(); ctx.ellipse(0, 0, g.s * pw, g.s * pw * .45, 0, 0, TAU); ctx.fill(); ctx.restore(); }
    ctx.restore();
    label(ctx, `map rendered from ${G.length} Gaussians`, x1, y0 - 10, COL.ink, 'left', 10.5, 600);
    hud(ctx, [`render → compare → back-propagate → densify / prune`, `GPU memory grows with Gaussian count`], x1 + 8, y0 + ph - 20, COL.ink);
  });
  return st;
}

/* ---------- multi-drone map merge ---------- */
function swarmSim(parent) {
  const st = makeCanvas(parent, 0.46, 280, 460);
  const cols = [COL.vis, COL.lid, COL.fus];
  const r = rng(2);
  const paths = [
    [[3, 3], [10, 3], [10, 9], [16, 9], [16, 14]],
    [[30, 3], [22, 3], [22, 9], [16, 9], [16, 4]],
    [[16, 18], [10, 18], [10, 13], [16, 13], [22, 13], [22, 18]]
  ];
  const segsOf = (P) => { const c = [0]; for (let i = 1; i < P.length; i++) c.push(c[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1])); return c; };
  const at = (P, s) => { const c = segsOf(P); s = clamp(s, 0, c[c.length - 1]); for (let i = 1; i < P.length; i++) if (s <= c[i]) { const t = (s - c[i - 1]) / (c[i] - c[i - 1]); return [lerp(P[i - 1][0], P[i][0], t), lerp(P[i - 1][1], P[i][1], t)]; } return P[P.length - 1]; };
  const drift = [[0, 0, 0], [1.6, -1.1, .12], [-1.2, 1.4, -.1]];
  animate(st, (st, dt) => {
    const { ctx, w, h } = st; ctx.clearRect(0, 0, w, h);
    const T = st.t % 16; const s = Math.min(T, 11) * 2.1;
    const mergeT = clamp((T - 11.5) / 1.5, 0, 1); const e = mergeT * mergeT * (3 - 2 * mergeT);
    const S = Math.min((w - 40) / 32, (h - 70) / 21), ox = (w - 32 * S) / 2, oy = 40;
    const X = (x) => ox + x * S, Y = (y) => oy + (21 - y) * S;
    ctx.strokeStyle = COL.hair; ctx.lineWidth = 1; ctx.strokeRect(X(0), Y(21), 32 * S, 21 * S);
    paths.forEach((P, i) => {
      const [dx, dy, da] = drift[i].map(v => v * (1 - e));
      const tf = (p) => { const c = Math.cos(da), sn = Math.sin(da); const x = p[0] - 16, y = p[1] - 10; return [16 + x * c - y * sn + dx, 10 + x * sn + y * c + dy]; };
      // local map points along path (walls either side)
      ctx.fillStyle = hexA(cols[i], .55);
      const rr = rng(i + 5);
      for (let q = 0; q < s; q += .25) { const p = at(P, q); for (const side of [-1.3, 1.3]) { const pp = tf([p[0] + (rr() - .5) * .4 + side * (i === 2 ? 0 : .0), p[1] + side + (rr() - .5) * .3]); ctx.fillRect(X(pp[0]) - 1, Y(pp[1]) - 1, 2, 2); } }
      ctx.strokeStyle = cols[i]; ctx.lineWidth = 2; ctx.beginPath(); for (let q = 0; q <= s; q += .3) { const p = tf(at(P, q)); q ? ctx.lineTo(X(p[0]), Y(p[1])) : ctx.moveTo(X(p[0]), Y(p[1])); } ctx.stroke();
      const p = tf(at(P, s)); drone(ctx, X(p[0]), Y(p[1]), 0, .8, cols[i]);
      label(ctx, `UAV ${i + 1}${i ? ' (own frame)' : ' (reference)'}`, X(tf(P[0])[0]), Y(tf(P[0])[1]) + 16, cols[i], 'left', 10, 700);
    });
    if (T > 10.5 && T < 13.5) label(ctx, 'INTER-ROBOT LOOP CLOSURES at shared corridor → frames aligned, maps merged', w / 2, 24, COL.swm, 'center', 11, 700);
    else label(ctx, T < 11 ? 'Each UAV maps with its own drift and its own coordinate frame' : 'One consistent map; each UAV now knows where the others are', w / 2, 24, COL.mute, 'center', 10.5);
    const bytes = Math.round(s * 1.8);
    hud(ctx, [`exchanged so far: ~${bytes} kB of compact descriptors (schematic)`], 20, h - 12, COL.ink);
  });
  return st;
}

/* ---------- UWB anchors ---------- */
function uwbSim(parent) {
  const st = makeCanvas(parent, 0.42, 260, 420);
  const anchors = [[2, 2], [26, 2], [26, 16], [2, 16]];
  const wall = [14, 0, 14, 10];
  animate(st, (st, dt) => {
    const { ctx, w, h } = st; ctx.clearRect(0, 0, w, h);
    const S = Math.min((w - 40) / 28, (h - 84) / 18), ox = (w - 28 * S) / 2, oy = 14;
    const X = (x) => ox + x * S, Y = (y) => oy + (18 - y) * S;
    const p = [14 + Math.cos(st.t * .5) * 9, 9 + Math.sin(st.t * .7) * 5];
    ctx.strokeStyle = COL.ink; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(X(wall[0]), Y(wall[1])); ctx.lineTo(X(wall[2]), Y(wall[3])); ctx.stroke();
    label(ctx, 'concrete / metal wall', X(14) + 6, Y(1), COL.mute);
    const ranges = anchors.map(a => { let d = Math.hypot(p[0] - a[0], p[1] - a[1]); const nlos = segCross(p[0], p[1], a[0], a[1], { x1: wall[0], y1: wall[1], x2: wall[2], y2: wall[3] }); if (nlos) d += 1.6; return { a, d, nlos }; });
    // least squares multilateration (Gauss-Newton few iters)
    let e = [14, 9];
    for (let it = 0; it < 8; it++) { let A = [0, 0, 0], b = [0, 0]; for (const rg of ranges) { const dx = e[0] - rg.a[0], dy = e[1] - rg.a[1]; const dd = Math.hypot(dx, dy) || 1; const J = [dx / dd, dy / dd]; const res = rg.d - dd; A[0] += J[0] * J[0]; A[1] += J[0] * J[1]; A[2] += J[1] * J[1]; b[0] += J[0] * res; b[1] += J[1] * res; } const det = A[0] * A[2] - A[1] * A[1]; e = [e[0] + (A[2] * b[0] - A[1] * b[1]) / det, e[1] + (A[0] * b[1] - A[1] * b[0]) / det]; }
    for (const rg of ranges) { ctx.strokeStyle = hexA(rg.nlos ? COL.bad : COL.swm, .55); ctx.lineWidth = 1.3; ctx.beginPath(); ctx.arc(X(rg.a[0]), Y(rg.a[1]), rg.d * S, 0, TAU); ctx.stroke(); ctx.fillStyle = COL.swm; ctx.fillRect(X(rg.a[0]) - 5, Y(rg.a[1]) - 5, 10, 10); label(ctx, rg.nlos ? 'NLOS +1.6 m' : 'LOS', X(rg.a[0]) + 8, Y(rg.a[1]) - 8, rg.nlos ? COL.bad : COL.swm, 'left', 10, 700); }
    drone(ctx, X(p[0]), Y(p[1]), 0, 1);
    ctx.strokeStyle = COL.bad; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(X(e[0]), Y(e[1]), 6, 0, TAU); ctx.stroke();
    hud(ctx, [`UWB-only fix error ${Math.hypot(e[0] - p[0], e[1] - p[1]).toFixed(2)} m`, 'fused with VIO/LIO in the factor graph, ranges', 'bound long-term drift; NLOS needs robust loss'], 14, h - 46, COL.ink);
  });
  return st;

      { t: 'Reject the impostor', p: 'Corridors look alike. The red match is wrong: it is <b>inconsistent</b> with the other matches (they imply a different B→C transform). Pairwise Consistency Maximisation (PCM, Mangelson et al. ICRA 2018) keeps the largest set of mutually consistent loops and drops the rest — used by DOOR-SLAM, Kimera-Multi and Swarm-SLAM.' },
      { t: 'Range between drones', p: 'UWB radios give drone-to-drone <b>distances</b> (lines, metres) at tens of Hz, even without visual overlap. Omni-swarm and D²SLAM fuse these ranges with visual detections of the other drones, which keeps the relative frames bounded between loop closures — critical for formation flight and collision avoidance.' },
    ],
    onStep: (S, i) => { S.u = i >= 2 ? (i === 2 ? 0 : 1) : 0; },
    build: (stage, S) => {
      const st = view3d(stage, { aspect: .62, yaw: -2.0, pitch: .9, dist: 34, target: [15, 10, 0], minDist: 6, maxDist: 90 });
      S.add(ctlBtns(['Replay alignment', () => { S.u = 0; }]), [2]);
      const GE = [[0, 0, 0], [-9, 4, .9], [-6, -5, -.7]]; // initial guess error per frame: dx, dy, dyaw
      const tf = (d, u, p) => { const F = W.frames[d], g = GE[d], k = 1 - u; const c = Math.cos(g[2] * k), s = Math.sin(g[2] * k); const dx = p[0] - F.x, dy = p[1] - F.y; return [F.x + c * dx - s * dy + g[0] * k, F.y + s * dx + c * dy + g[1] * k, p[2]]; };
      const fyaw = (d, u) => W.frames[d].yaw + GE[d][2] * (1 - u);
      animate(st, (st, dt) => {
        const step = S.step; if (step === 2) S.u = Math.min(1, S.u + dt / 2.4);
        const u = step < 2 ? 0 : S.u; const e = u * u * (3 - 2 * u);
        st.begin(dt);
        st.grid(0, 30, 0, 20, 2, 0, '#ececf0');
        if (e > .95) for (const [x1, y1, x2, y2] of W.walls) st.face([[x1, y1, 0], [x2, y2, 0], [x2, y2, 3], [x1, y1, 3]], '#9aa0a6', { alpha: .05, stroke: '#c8c8ce', salpha: 3 });
        const pos = W.tracks.map((tr, d) => { const k = Math.floor((st.t * 6 + d * 40) % tr.length); return tr[k]; });
        for (let d = 0; d < 3; d++) {
          const col = W.cols[d];
          for (const p of W.maps[d]) st.dot(tf(d, e, p), 1.5, col, { alpha: .55 });
          st.path(W.tracks[d].map(q => tf(d, e, [q[0], q[1], W.alt[d]])), col, 2);
          const F = W.frames[d]; const o = tf(d, e, [F.x, F.y, 0]);
          st.axes(o, m3.rz(fyaw(d, e)), 1.4, { names: [`x${W.names[d]}`, `y${W.names[d]}`, 'z'], labels: true });
          st.text(o, `frame ${W.names[d]}`, col, { dx: -10, dy: 14, align: 'right', size: 10, weight: 700, bg: 'rgba(255,255,255,.85)' });
          const p = pos[d]; st.drone(tf(d, e, [p[0], p[1], W.alt[d]]), m3.I(), col, 1.6);
        }
        if (step >= 1) for (const m of W.matches) { const A = tf(m.a, e, [...W.tracks[m.a][m.i], W.alt[m.a]]), B = tf(m.b, e, [...W.tracks[m.b][m.j], W.alt[m.b]]); st.line(A, B, COL.ok, 2.4, { dash: [5, 3] }); st.dot(A, 4, COL.ok); st.dot(B, 4, COL.ok); if (step === 1) st.text(v3.l(A, B, .5), `${W.names[m.a]}↔${W.names[m.b]} match`, COL.ok, { dx: 8, size: 9.5, bg: 'rgba(255,255,255,.85)' }); }
        if (step === 3) { const m = W.falseM; const A = tf(m.a, e, [...W.tracks[m.a][m.i], W.alt[m.a]]), B = tf(m.b, e, [...W.tracks[m.b][m.j], W.alt[m.b]]); st.line(A, B, COL.lid, 2.4, { dash: [5, 3] }); st.text(v3.l(A, B, .5), '✗ rejected by PCM: inconsistent', COL.lid, { dx: 8, size: 9.5, bg: 'rgba(255,255,255,.85)' }); }
        const rows = [['agents', '3'], ['map points A / B / C', W.maps.map(m => m.length).join(' / ')]];
        if (step >= 1) rows.push(['inter-robot loops found', String(W.matches.length)], ['NetVLAD descriptor', '4096 × 4 B = 16 KB'], ['raw LiDAR frame', '20,000 pts × 16 B ≈ 320 KB']);
        if (step >= 2) rows.push(['alignment', (e * 100).toFixed(0) + ' %', e > .99 ? COL.ok : COL.warn]);
        if (step === 3) rows.push(['outliers rejected', '1 of ' + (W.matches.length + 1), COL.lid]);
        if (step === 4) {
          const P = pos.map((p, d) => [p[0], p[1], W.alt[d]]);
          for (let a = 0; a < 3; a++) for (let b = a + 1; b < 3; b++) { const d = v3.n(v3.s(P[a], P[b])); st.line(P[a], P[b], COL.spc, 1.4, { dash: [2, 3] }); st.text(v3.l(P[a], P[b], .5), d.toFixed(2) + ' m', COL.spc, { size: 9.5, align: 'center', bg: 'rgba(255,255,255,.85)' }); rows.push([`UWB range ${W.names[a]}–${W.names[b]}`, d.toFixed(2) + ' m', COL.spc]); }
        }
        S.ro(rows);
        st.flush();
      });
    }
  });
}

const FITQ = [

function fitScore(m, ans) {
  const S = ans.sens, why = []; let ok = true;
  const has = (k) => S.has(k);
  const r = m.req || {};
  const anyCam = has('mono') || has('stereo'); const anyLidar = has('livox') || has('spin');
  if (r.cam === 'mono' && !anyCam) { ok = false; why.push(['needs a camera', 'neg']); }
  if (r.cam === 'stereo' && !has('stereo')) { ok = false; why.push(['needs stereo', 'neg']); }
  if (r.lidar === 'any' && !anyLidar) { ok = false; why.push(['needs LiDAR', 'neg']); }
  if ((r.lidar === 'spinning' || r.lidar === 'ouster') && !has('spin')) { ok = false; why.push([r.lidar === 'ouster' ? 'needs Ouster LiDAR' : 'needs spinning LiDAR', 'neg']); }
  if (r.lidar === 'livox' && !has('livox')) { ok = false; why.push(['needs Livox LiDAR', 'neg']); }
  for (const k of ['thermal', 'radar', 'event', 'uwb']) if (r[k] && !has(k)) { ok = false; why.push(['needs ' + k, 'neg']); }
  const cpu = [...ans.cpu][0];
  if (r.gpu === 'desktop' && cpu !== 'offline') { ok = false; why.push(['desktop GPU only', 'neg']); }
  if (r.gpu === true && (cpu === 'nuc' || cpu === 'small')) { ok = false; why.push(['needs Jetson GPU', 'neg']); }
  const prio = [...ans.prio][0];
  if (r.multi && prio !== 'swarm') { ok = false; why.push(['multi-drone system', 'neg']); }
  const s = m.scores; let base;
  if (prio === 'flight') base = s.rob * .3 + s.eff * .3 + s.rdy * .25 + s.acc * .15;
  else if (prio === 'acc') base = s.acc * .45 + s.glo * .25 + s.rob * .2 + s.rdy * .1;
  else if (prio === 'map') base = s.map * .45 + s.acc * .2 + s.glo * .2 + s.rdy * .15;
  else base = s.glo * .35 + s.rob * .25 + s.rdy * .2 + s.eff * .2;
  let sc = base / 5 * 100;
  if (prio === 'swarm' && m.fam === 'swm') { sc += 10; why.push(['multi-drone', 'pos']); } else if (prio === 'swarm') { sc -= 18; why.push(['single-drone only', 'neg']); }
  const envMap = { indoor: ['tex'], tunnel: ['deg', 'dark'], dark: ['dark'], smoke: ['smoke'], fast: ['spin', 'vib'], loops: ['drift'] };
  const envLbl = { tex: 'low texture', deg: 'corridors', dark: 'darkness', smoke: 'smoke', spin: 'fast motion', vib: 'vibration', drift: 'long-range drift' };
  const seen = new Set();
  for (const e of ans.env) for (const k of envMap[e]) { if (seen.has(k)) continue; seen.add(k); const v = m.fails[k]; if (v === 2) { sc -= 16; why.push(['fails: ' + envLbl[k], 'neg']); } else if (v === 1) { sc -= 6; why.push(['degrades: ' + envLbl[k], '']); } else why.push(['robust: ' + envLbl[k], 'pos']); }
  if (cpu === 'small') { if (m.cost === 3) { sc -= 30; why.push(['too heavy for small ARM', 'neg']); } else if (m.cost === 2) { sc -= 10; why.push(['tight on small ARM', '']); } else why.push(['light compute', 'pos']); }
  if (cpu === 'nuc' && m.cost === 1) why.push(['light compute', 'pos']);
  if (cpu === 'offline' && prio === 'flight' && m.cost === 3) sc -= 10;
  if ([...ans.ros][0] === 'ros2') { if (/ROS 2/.test(m.ros)) why.push(['ROS 2', 'pos']); else { sc -= 12; why.push(['no official ROS 2', 'neg']); } }
  if (/flown|Real|onboard|Onboard/.test(m.drone.join(' ')) && /(onboard|Onboard|flights|flown)/.test(m.drone[0])) why.push(['flight evidence', 'pos']);
  return { ok, s: Math.round(clamp(sc, 1, 99)), why: why.slice(0, 7) };
}
function fitAdvice(ans, top) {
  const a = [];
  const S = ans.sens, E = ans.env;
  const lid = S.has('livox') || S.has('spin'), cam = S.has('mono') || S.has('stereo');
  if (E.has('tunnel') && lid && !cam) a.push('LiDAR alone slides along featureless corridors; adding a camera (FAST-LIVO2) or using LiDAR intensity (COIN-LIO, Ouster) removes most of that.');
  if (E.has('tunnel') && lid && cam) a.push('With LiDAR and a camera, tight LiDAR-visual fusion covers both corridors and darkness.');
  if ((E.has('dark') || E.has('smoke')) && !lid && !S.has('thermal') && !S.has('radar')) a.push('Cameras alone cannot see in darkness or smoke; consider adding a LiDAR, a thermal camera or a small radar.');
  if (E.has('smoke') && !S.has('thermal') && !S.has('radar')) a.push('Dense smoke and dust also corrupt LiDAR; thermal (CompSLAM, ROVTIO) or radar (EKF-RIO) channels are the proven fixes.');
  if (E.has('loops')) a.push('For revisits, prefer a system with loop closure or add a pose-graph back-end.');
  if ([...ans.cpu][0] === 'small') a.push('On a small ARM board, filters and ESIKF-based LIO (OpenVINS, S-MSCKF, FAST-LIO2, Point-LIO) have published embedded timings.');
  return a.join(' ');
}

const GAPS = [
  { t: 'Degeneracy-aware multi-modal fusion on one drone', d: 'Detect online which directions each sensor constrains (information-matrix eigen-analysis), and let the other modality take over only along those directions — instead of hard switching. Existing systems either treat it per-sensor (X-ICP, COIN-LIO) or with heuristics (CompSLAM, Super Odometry). A drone-flown, open, tightly coupled version is missing.', read: [['Zhang 2016 degeneracy', doi('10.1109/ICRA.2016.7487211')], ['X-ICP', arx('2211.16335')], ['COIN-LIO', '#coin-lio'], ['FAST-LIVO2', '#fast-livo2'], ['Super Odometry', '#super-odometry'], ['CompSLAM', '#compslam']], feas: 'High', hw: 'Mid-360 + camera + Orin', start: 'FAST-LIVO2 code, ENWIDE / GEODE / SubT-MRS' },
  { t: 'Radar-inertial(-LiDAR) odometry for smoke and fog', d: 'Single-chip mmWave radars are light and cheap, and EKF-RIO shows Doppler velocity alone flies a drone in fog. Fusing radar Doppler tightly into a LIO/LIVO estimator — so the drone degrades gracefully when smoke corrupts LiDAR — is open, measurable and publishable.', read: [['EKF-RIO / x-RIO', '#ekf-rio'], ['Kramer et al. ICRA 2020', doi('10.1109/ICRA40945.2020.9196666')], ['ColoRadar dataset', arx('2103.04510')], ['FAST-LIO2', '#fast-lio2']], feas: 'High', hw: '+ TI IWR6843AOP (~$35)', start: 'rio repo + ColoRadar, then own smoke tests' },
  { t: 'An onboard embedded benchmark for 2026 methods', d: 'Jeon et al. (2021) measured VIO on Jetsons, but nothing comparable exists for LIO, LIVO and learned methods on Orin-class boards. A careful, open benchmark (accuracy, CPU/GPU, memory, power, latency) on her own drone and on NTU VIRAL / UZH-FPV is highly cited and a solid first paper.', read: [['Jeon et al. 2021', arx('2103.01655')], ['Delmerico & Scaramuzza 2018', doi('10.1109/ICRA.2018.8460664')], ['KAIST VIO dataset', gh('url-kaist/kaistviodataset')]], feas: 'High', hw: 'Orin Nano + Orin NX', start: 'evo, tegrastats, the methods on this page' },
  { t: 'Thermal-inertial odometry that copes with FFC and flat scenes', d: 'Thermal sees through smoke and darkness, but flat-field-correction freezes and thermally flat scenes break tracking. Learned thermal features (TP-TIO) were never released; ROVTIO has no published evaluation. A reproducible, open TIO with FFC handling would fill a clear gap.', read: [['Khattak KTIO', arx('1903.00798')], ['TP-TIO', arx('2012.03455')], ['ROVTIO', '#rovtio'], ['CompSLAM', '#compslam'], ['SubT-MRS', arx('2307.07607')]], feas: 'Medium', hw: '+ FLIR Boson/Lepton', start: 'ROVTIO + SubT-MRS thermal sequences' },

  const laneName = { vio: 'VIO', lio: 'LIO', livo: 'LIVO', deg: 'DEGRADED', lrn: 'LEARNED', swm: 'SWARM' };
  const pos = {}; let top = 40; const laneY = {};
  for (const f of lanesOrder) {
    const ns_ = LINEAGE.nodes.filter(n => n.f === f).map(n => ({ n, x: X(n.y), w: n.label.length * 6.6 + 18 })).sort((a, b) => a.x - b.x);
    const rows = [];
    for (const it of ns_) { let r = rows.findIndex(end => end + 8 < it.x - it.w / 2); if (r < 0) { rows.push(0); r = rows.length - 1; } rows[r] = it.x + it.w / 2; pos[it.n.id] = { x: it.x, y: top + 14 + r * 28, w: it.w }; }
    laneY[f] = [top, top + 14 + (rows.length - 1) * 28 + 18]; top = laneY[f][1] + 18;
  }
  const H = top + 6;
  const svg = mk('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H });
  for (let y = 2013; y <= 2026; y += 1) { svg.append(mk('line', { x1: X(y), x2: X(y), y1: 24, y2: H - 6, stroke: COL.hair })); svg.append(mk('text', { x: X(y), y: 16, 'font-size': 11, 'text-anchor': 'middle', fill: COL.mute, 'font-family': 'JetBrains Mono' }, y)); }
  lanesOrder.forEach((f, i) => { if (i % 2 === 0) svg.prepend(mk('rect', { x: 0, y: laneY[f][0] - 6, width: W, height: laneY[f][1] - laneY[f][0] + 12, fill: '#fafafc' })); svg.append(mk('text', { x: 8, y: (laneY[f][0] + laneY[f][1]) / 2 + 4, 'font-size': 10, fill: FAM[f].col, 'font-family': 'JetBrains Mono', 'font-weight': 700 }, laneName[f])); });
  for (const [a, b] of LINEAGE.edges) { const A = pos[a], B = pos[b]; if (!A || !B) continue; const ax = A.x + A.w / 2, bx = B.x - B.w / 2; svg.append(mk('path', { d: `M${ax},${A.y} C${(ax + bx) / 2},${A.y} ${(ax + bx) / 2},${B.y} ${bx},${B.y}`, fill: 'none', stroke: '#c7c7cc', 'stroke-width': 1.4 })); }
  LINEAGE.nodes.forEach(n => {
    const p = pos[n.id]; const g = mk('g', { class: 'lin-node', transform: `translate(${p.x},${p.y})` });
    const onPage = !!byId(n.id); const col = FAM[n.f].col;
    g.append(mk('rect', { x: -p.w / 2, y: -11, width: p.w, height: 22, rx: 11, fill: onPage ? '#fff' : COL.soft, stroke: onPage ? col : COL.hair, 'stroke-width': onPage ? 1.8 : 1 }));
    g.append(mk('text', { x: 0, y: 4, 'text-anchor': 'middle', 'font-size': 11, 'font-weight': onPage ? 700 : 500, fill: onPage ? COL.ink : COL.mute, 'font-family': 'Archivo, sans-serif' }, n.label));
    if (onPage) { g.style.cursor = 'pointer'; g.addEventListener('click', () => openDetail(n.id)); }
    svg.append(g);
  });
  parent.append(svg);
}
